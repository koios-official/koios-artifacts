# Local integration test fixture.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   KOIOS_PG_TEST_DSN="postgres://tester:testpw@127.0.0.1:5432/pooltest?sslmode=disable" \
#     go test -race -count=1 -tags=integration ./...
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:18-alpine
    container_name: pmf-pg-test
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: testpw
      POSTGRES_DB: pooltest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tester -d pooltest"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
