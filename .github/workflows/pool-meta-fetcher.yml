name: pool-meta-fetcher

on:
  push:
    paths:
      - 'files/grest/pool-meta-fetcher/**'
      - 'openspec/specs/pool-offchain-fetcher/**'
      - 'openspec/specs/pool-meta-fetcher-config/**'
      - '.github/workflows/pool-meta-fetcher.yml'
  pull_request:
    paths:
      - 'files/grest/pool-meta-fetcher/**'

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: files/grest/pool-meta-fetcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=$(echo ${GITHUB_SHA} | cut -c1-7)" -o bin/pool-meta-fetcher ./cmd/pool-meta-fetcher

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: go test (no race, fast)
        run: go test -count=1 ./...

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pool-meta-fetcher-${{ github.sha }}
          path: files/grest/pool-meta-fetcher/bin/pool-meta-fetcher
          retention-days: 14

      - name: Docker build (cache)
        run: |
          docker build --build-arg VERSION=$(echo ${GITHUB_SHA} | cut -c1-7) \
            -t koios-pool-meta-fetcher:ci .
